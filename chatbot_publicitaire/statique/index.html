<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat gratuit</title>
<style>
  :root { --fond:#f6f7fb; --carte:#fff; --texte:#1d2330; --doux:#667085; --accent:#2f6fed; --bord:#e3e6ee; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#0f131a; --carte:#171c25; --texte:#e7eaf0; --doux:#98a2b3; --accent:#5b8cff; --bord:#283041; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--fond); color:var(--texte);
               font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Deux zones fixes, côte à côte, sans aucun chevauchement : 75 % chat, 25 % publicité. */
  .ecran { display:grid; grid-template-columns:3fr 1fr; height:100vh; height:100dvh; }
  .chat { display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--bord); }
  .pub  { display:flex; flex-direction:column; gap:12px; padding:12px; min-width:0; overflow:auto; background:var(--carte); }
  @media (max-width:760px) {          /* téléphone : chat en haut (75 %), publicité en bas (25 %) */
    .ecran { grid-template-columns:1fr; grid-template-rows:3fr 1fr; }
    .chat { border-right:0; border-bottom:1px solid var(--bord); min-height:0; }
    .pub { flex-direction:row; }
    .pub > * { flex:1; min-width:0; }
  }
  header { padding:10px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bord); }
  header b { font-size:17px; }
  .solde { font-variant-numeric:tabular-nums; color:var(--doux); }
  .solde strong { color:var(--accent); }
  #fil { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .moi { align-self:flex-end; background:var(--accent); color:#fff; }
  .ia  { align-self:flex-start; background:var(--carte); border:1px solid var(--bord); }
  .info { align-self:center; color:var(--doux); font-size:14px; text-align:center; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--bord); }
  textarea { flex:1; resize:none; height:48px; padding:12px; border-radius:10px; border:1px solid var(--bord);
             background:var(--carte); color:var(--texte); font:inherit; }
  button { border:0; border-radius:10px; padding:0 16px; min-height:44px; background:var(--accent); color:#fff;
           font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .emplacement { border:1px dashed var(--bord); border-radius:10px; min-height:90px; display:flex; align-items:center;
                 justify-content:center; color:var(--doux); font-size:13px; text-align:center; overflow:hidden; }
  .recompense { display:flex; flex-direction:column; gap:8px; }
  .recompense p { margin:0; font-size:13px; color:var(--doux); }
  .etiquette { font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--doux); }
</style>
</head>
<body>
<div class="ecran">
  <main class="chat">
    <header><b>💬 Chat gratuit</b><span class="solde">Messages : <strong id="solde">0</strong> / <span id="plafond">20</span></span></header>
    <div id="fil" aria-live="polite"></div>
    <form id="formulaire">
      <textarea id="saisie" placeholder="Écrivez votre question…" maxlength="1000" aria-label="Votre message"></textarea>
      <button id="envoyer" type="submit">Envoyer</button>
    </form>
  </main>

  <aside class="pub" aria-label="Publicité">
    <div>
      <div class="etiquette">Publicité</div>
      <!-- Bannière display de la régie (Google Ad Manager / AdSense…) ; rafraîchie seulement si la régie l'autorise. -->
      <div id="banniere" class="emplacement">Emplacement de bannière</div>
    </div>
    <div class="recompense">
      <div class="etiquette">Vidéo récompensée</div>
      <button id="video" type="button">🎬 Regarder une vidéo : +<span id="par_video">5</span> messages</button>
      <p id="etat_video">La vidéo s'ouvre dans le lecteur de la régie. Les messages sont crédités quand la régie confirme
        la fin de la vidéo à notre serveur.</p>
    </div>
  </aside>
</div>

<script>
/* ---------------------------------------------------------------------------------------------------------------
   Réglages de la régie : renseignez ici vos identifiants (Ad Manager pour le web, AdMob dans l'application mobile).
   --------------------------------------------------------------------------------------------------------------- */
const REGIE = {
  banniere: null,            // ex. { chemin: "/1234567/chat_banniere", tailles: [[300, 250], [320, 100]] }
  rafraichirSecondes: 30,    // à déclarer dans la régie ; 0 pour ne jamais rafraîchir
};

const fil = document.getElementById("fil"), saisie = document.getElementById("saisie");
const boutonEnvoyer = document.getElementById("envoyer"), boutonVideo = document.getElementById("video");
let jeton = null, utilisateur = null, solde = 0;

function ajouter(texte, classe) {
  const d = document.createElement("div");
  d.className = "msg " + classe; d.textContent = texte;          // textContent : aucun HTML injecté
  fil.appendChild(d); fil.scrollTop = fil.scrollHeight;
}
function afficherSolde(s) {
  solde = s; document.getElementById("solde").textContent = s;
  boutonEnvoyer.disabled = s <= 0;
  const plein = s >= Number(document.getElementById("plafond").textContent);   // portefeuille plein : vidéo inutile
  boutonVideo.disabled = plein;
  if (plein) document.getElementById("etat_video").textContent = "Portefeuille plein : utilisez vos messages d'abord.";
  saisie.placeholder = s > 0 ? "Écrivez votre question…" : "Solde à zéro : regardez une vidéo pour obtenir des messages.";
}
async function api(chemin, options = {}) {
  const r = await fetch(chemin, { ...options, headers: { "Content-Type": "application/json",
                                  ...(jeton ? { Authorization: "Bearer " + jeton } : {}) } });
  const corps = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(corps.erreur || "Erreur " + r.status);
  return corps;
}

async function demarrer() {
  try { jeton = localStorage.getItem("jeton"); utilisateur = localStorage.getItem("utilisateur"); } catch (_) {}
  try {
    if (jeton) { afficherSolde((await api("/api/solde")).solde); }
    else { throw new Error("nouvelle session"); }
  } catch (_) {
    const s = await api("/api/session", { method: "POST" });
    jeton = s.jeton; utilisateur = s.utilisateur_id;
    document.getElementById("plafond").textContent = s.plafond;
    document.getElementById("par_video").textContent = s.messages_par_video;
    try { localStorage.setItem("jeton", jeton); localStorage.setItem("utilisateur", utilisateur); } catch (_) {}
    afficherSolde(0);
  }
  ajouter("Bienvenue ! Chaque vidéo regardée jusqu'au bout vous donne des messages gratuits.", "info");
  chargerBanniere();
}

document.getElementById("formulaire").addEventListener("submit", async (e) => {
  e.preventDefault();
  const texte = saisie.value.trim();
  if (!texte || solde <= 0) return;
  saisie.value = ""; ajouter(texte, "moi"); boutonEnvoyer.disabled = true;
  try { const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: texte }) });
        ajouter(r.reponse, "ia"); afficherSolde(r.solde); }
  catch (err) { ajouter(err.message, "info"); afficherSolde((await api("/api/solde").catch(() => ({ solde }))).solde); }
});
saisie.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("formulaire").requestSubmit(); }
});

/* Vidéo récompensée : lancée uniquement par le clic de l'utilisateur. Le crédit vient du serveur (rappel signé de la
   régie) ; la page se contente d'interroger le solde après la vidéo. */
boutonVideo.addEventListener("click", async () => {
  const etat = document.getElementById("etat_video");
  if (window.AdMobPont) {                // application mobile (Capacitor, WebView…) : SDK AdMob natif
    boutonVideo.disabled = true; etat.textContent = "Vidéo en cours…";
    try { await window.AdMobPont.montrerVideoRecompensee({ userId: utilisateur }); }   // user_id transmis au rappel SSV
    catch (_) { etat.textContent = "Aucune vidéo disponible pour le moment."; }
    boutonVideo.disabled = false; attendreCredit(etat);
  } else {
    etat.textContent = "Les vidéos récompensées sont disponibles dans l'application mobile (ou avec une régie web " +
                       "qui confirme les vidéos à notre serveur).";
  }
});
async function attendreCredit(etat) {
  const avant = solde;
  for (let i = 0; i < 10; i++) {
    await new Promise((r) => setTimeout(r, 2000));
    const s = (await api("/api/solde")).solde;
    if (s !== avant) { afficherSolde(s); etat.textContent = "✅ Messages crédités."; return; }
  }
  etat.textContent = "Crédit non confirmé par la régie (vidéo interrompue ?).";
}

/* Bannière Google Publisher Tag, chargée seulement si la régie est configurée. */
function chargerBanniere() {
  if (!REGIE.banniere) return;
  const s = document.createElement("script");
  s.src = "https://securepubads.g.doubleclick.net/tag/js/gpt.js"; s.async = true; document.head.appendChild(s);
  window.googletag = window.googletag || { cmd: [] };
  googletag.cmd.push(() => {
    const slot = googletag.defineSlot(REGIE.banniere.chemin, REGIE.banniere.tailles, "banniere").addService(googletag.pubads());
    googletag.enableServices(); googletag.display("banniere");
    if (REGIE.rafraichirSecondes > 0) {
      setInterval(() => { if (document.visibilityState === "visible") googletag.pubads().refresh([slot]); },
                  REGIE.rafraichirSecondes * 1000);   // seulement onglet visible : pas d'impressions fantômes
    }
  });
}

demarrer();
</script>
</body>
</html>
